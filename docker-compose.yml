services:
  postgres:
    image: postgres:17
    container_name: phishing-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: phishing_db
      POSTGRES_USER: phishing_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishing_user -d phishing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: