[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-detection-ai"
version = "0.1.0"
description = "Staged phishing URL detection project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.3.0",
    "langgraph>=1.2.18",
    "numpy>=2.2.6",
    "onnxruntime>=1.24.3",
    "pandas>=2.0,<3.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.65.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]
